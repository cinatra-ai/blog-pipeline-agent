name: truthful-attribution-gate
# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per the ratified truthful-attribution spec. WARN mode: findings are
# annotated, the check is ALWAYS green - it never fails a PR.
#
# Double-pinned: the `uses:` ref and the `ref` input below name the SAME
# cinatra-ai/ci commit (7c767fe7, grant revision 3), and .github/gate-suite.json
# names that commit as the `pinned` engine of this context's requiredContexts
# row - move all three in one commit. That commit carries no tag. The actions
# pin gate requires a comment of the form `# v<number>` on the uses: line, so
# that comment is a bare `v0` with the engine's short sha as build metadata; it
# claims no tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is required: the engine resolves a reusable-workflow check-run to
  # its Actions run to verify the called workflow at the pinned commit. With an
  # explicit permissions block, any omitted scope defaults to none, and a called
  # reusable workflow cannot exceed the caller's grant — omitting this causes a
  # startup failure that WARN mode cannot rescue. Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@7c767fe7fabc5e4fb93e2142987a2b2dff502014 # v0+engine.7c767fe7.grant.3
    with:
      mode: warn
      ref: 7c767fe7fabc5e4fb93e2142987a2b2dff502014
